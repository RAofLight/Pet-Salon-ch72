<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuerry Intro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="./styles/style.css">


</head>
<body class="m-5">
    <h1>Introduction to jQuerry</h1>
    <h2>Practicing jQuerry Actions</h2>

    <!-- Paragraph -->
     <p class="m-5">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corporis, quam! Vel non temporibus quidem amet perspiciatis debitis ea earum sunt, molestias nostrum dolore est molestiae totam deleniti, cupiditate mollitia consequuntur!</p>

     <!-- Buttons to tirgger actions-->

    <div class="d.flex flex-wrap gap-3 m-5">
        <!-- Button to learn how to trigger events or functions -->
         <button id="triggerEventBtn" class="btn btn-secondary">Trigger Event</button>

         <!-- Button to manipulate the paragraph and practice jQuerry actions -->
          <button id="hideP" class="btn btn-primary">Hide</button>
          <button id="showP" class="btn btn-success">Show</button>
          <button id="toggleP" class="btn btn-danger">Toggle</button>
          <button id="changeText" class="btn btn-warning">Change Text</button>
          <button id="applyCSS" class="btn btn-info">Apply CSS</button>
          <button id="applyCSSClass" class="btn btn-dark">Apply CSS Class</button>
    </div>

    <script
  src="https://code.jquery.com/jquery-4.0.0.js"
  integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
  crossorigin="anonymous"></script>

    <script src="./scripts/105-jquerry-intro.js"></script>
</body>
</html>
