    <h1>Registration</h1>
  <form class="bg-primary p-4 border rounded mt-4 mb-4 w-75">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" type="text" id="" placeholder="Apollo">
    </div>

    <div class="mb-3">
      <label class="form-label">Age</label>
      <input class="form-control" type="number" id="" placeholder="3">
    </div>

    <div class="mb-3">
      <label class="form-label">Breed</label>
      <input class="form-control" type="text" id="" placeholder="Brussels Griffon">
    </div>

    <div class="mb-3">
      <label class="form-label">Gender</label>
      <select class="form-select" id="">
        <option value="select gender">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Service</label>
      <select class="form-select" id="">
        <option value="select package">Select Package</option>
        <option value="pizzazz package">Pizzazz Package</option>
        <option value="glow & flow package">Glow & Flow Package</option>
        <option value="pamper package">Pamper Package</option>
        <option value="style package">Style Package</option>
        <option value="shine package">Shine Package</option>
        <option value="fluff package">Fluff Package</option>
      </select>
    </div>

    <div class="d-flex justify-content-end gap-3">

        <button class="btn btn-success" type="submit">Register</button>

        <button class="btn btn-warning" type="reset">Reset</button>

    </div>

  </form>

    <h2>Registered Pets</h2>

    <div>
      <ol id="petNames">
      </ol>
    </div>
