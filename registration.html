<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./styles/registration.css">

</head>
<body>

   <nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Paws-n-Treats</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="registration.html">Registration</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="services.html">Services</a>
        </li> 
      
    </div>
  </div>
</nav>

    <h1 class="m-4">Registration</h1>
  <form class="bg-primary p-4  m-4 rounded mt-4 mb-4">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" type="text" id="petName" placeholder="Pet Name">
    </div>

    <div class="mb-3">
      <label class="form-label">Age</label>
      <input class="form-control" type="number" id="petAge" placeholder="Pet Age">
    </div>

    <div class="mb-3">
      <label class="form-label">Breed</label>
      <input class="form-control" type="text" id="petBreed" placeholder="Pet Breed">
    </div>

    <div class="mb-3">
      <label class="form-label">Gender</label>
      <select class="form-select" id="petGender">
        <option value="select gender">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Service</label>
      <select class="form-select" id="petService">
        <option value="select package">Select Package</option>
        <option value="Pizzazz Package">Pizzazz Package</option>
        <option value="Glow & Flow package">Glow & Flow Package</option>
        <option value="Pamper Package">Pamper Package</option>
        <option value="Style Package">Style Package</option>
        <option value="Shine Package">Shine Package</option>
        <option value="Fluff Package">Fluff Package</option>
        <option value="Wash-n-Shine">Wash-n-Shine</option>
        <option value="Groom">Groom</option>
        <option value="Ears, Nails, Glands">Ears, Nails, Glands</option>
      </select>
    </div>

    <div class="d-flex justify-content-end gap-3">

        <button onclick="registerPet(event)" class="btn btn-success" type="submit">Register</button>

        <button class="btn btn-warning" type="reset">Reset</button>

    </div>

  </form>
  
  <section class="m-4 border rounded"> 
    <h2 class="bg-secondary border rounded">Registered Pets</h2>

    <table class="table mt-4">
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Breed</th>
        <th>Gender</th>
        <th>Service</th>
        <th>Delete</th>
      </tr>

      <tbody id="body">
        <tr>
          <td></td>
        </tr>
      </tbody>

    </table>

  </section> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="./scripts/registration.js"></script>
</body>
</html>
