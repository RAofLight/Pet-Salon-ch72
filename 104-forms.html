<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">


    <title>Forms</title>
</head>
<body>
   
    <section class="m-4">
        <h1>Product Registartion</h1>

        <form class="bg-light p-4 border rounded mt-4">
           
           <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" id="productName" placeholder="Pineapple">
           </div>

           <div class="mb-3">
            <label class="form-label">Price</label>
            <input class="form-control"  type="number" id="productPrice" placeholder="11">
           </div>

           <div class="mb-3">
             <label class="form-label">Category</label>

             <select class="form-select" id="productCategory">
                <option value="">Select a catagory</option>
                <option value="fruits">Fruits</option>
                <option value="electronics">Electronics</option>
             </select>

           </div>

           <div class="d-flex justify-content-end gap-3">

               <button onclick="registerProduct(event)" class="btn btn-primary" type="submit">Register</button>

               <button class="btn btn-secondary" type="reset">Reset</button>

           </div>

        </form>

    </section>

    <section class="m-4">
        <h2>Registered Products</h2>

        <!-- Table -->
         <table class="table mt-4">
            <!-- Header -->
             <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Category</th>
                <th>Delete</th>
             </tr>

            <!-- Body-->
             <tbody id="body">
                 <tr>
                   <td>Pineapple</td>
                   <td>11</td>
                   <td>fruits</td>
                 </tr>
            </tbody>
         </table>

    </section>

    <script src="./scripts/104-forms.js"></script>
</body>
</html>
